<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Install LOST | Zambaru</title><meta name="theme-color" content="#10235c">
<style>body{font-family:system-ui,Arial,sans-serif;background:#f5f8fc;color:#14243b;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:430px;background:white;border-radius:18px;padding:28px;margin:18px;box-shadow:0 8px 30px #10235c16;text-align:center}h1{margin:0 0 12px}a.button{display:block;background:#10235c;color:white;border-radius:10px;padding:15px;text-decoration:none;margin:14px 0}p{line-height:1.5}small{color:#58677b}</style></head>
<body><main><h1>LOST</h1><p>Lost or Found Something?</p><div id="status" role="status">Checking installation options…</div><div id="actions"></div><p><a href="https://www.zambaru.com">www.zambaru.com</a></p></main>
<script>
(async()=>{
 const status=document.getElementById('status'),actions=document.getElementById('actions');
 const android=/Android/i.test(navigator.userAgent),ios=/iPad|iPhone|iPod/i.test(navigator.userAgent);
 const apk='/downloads/lost.apk';
 if(android){
   let available=false;
   try{const r=await fetch(apk,{method:'HEAD',cache:'no-store'});available=r.ok && /application\/vnd\.android\.package-archive|application\/octet-stream/i.test(r.headers.get('content-type')||'');}catch(e){}
   if(available){status.textContent='Starting Android download…';actions.innerHTML='<a class="button" href="'+apk+'">Download LOST for Android</a>';location.replace(apk);}
   else {status.textContent='Android download is being prepared. Please return soon.';actions.innerHTML='<a class="button" href="/lost-app">Open LOST on the web</a>';}
 }else if(ios){status.textContent='On iPhone, open LOST in Safari and use Share → Add to Home Screen.';actions.innerHTML='<a class="button" href="/lost-app">Open LOST for iPhone</a>';}
 else {status.textContent='Open this link on your Android or iPhone to install LOST.';actions.innerHTML='<a class="button" href="/lost-app">Open LOST on the web</a>';}
})();
</script></body></html>
