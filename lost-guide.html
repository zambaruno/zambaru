<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOST — Zambaru</title><style>body{margin:0;background:#f4f8fa;color:#173247;font:16px/1.6 system-ui,sans-serif}header,main{max-width:1040px;margin:auto;padding:22px}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;background:white;border:1px solid #a6c2cd;border-radius:8px;padding:8px;cursor:pointer}button[aria-pressed=true]{background:#173c54;color:white}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1;margin-bottom:12px}.lead{font-size:1.2rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 18px #17324712}.icon{font-size:2rem}h2{font-size:1.25rem;margin:.3em 0}.note{background:#fff6dc;padding:16px;border-radius:12px;margin:24px 0}a{color:#126485}footer{padding:25px 0} @media(max-width:560px){nav{display:grid;grid-template-columns:repeat(2,1fr)}}</style></head><body><header><a href="./">ZAMBARU</a><nav id="languages" aria-label="Languages"></nav></header><main><h1 data-text="0"></h1><p class="lead" data-text="1"></p><div class="cards"><section class="card"><span class="icon">🔎</span><h2 data-text="2"></h2><p data-text="3"></p></section><section class="card"><span class="icon">🤝</span><h2 data-text="4"></h2><p data-text="5"></p></section><section class="card"><span class="icon">📷</span><h2 data-text="6"></h2><p data-text="7"></p></section><section class="card"><span class="icon">🌐</span><h2 data-text="8"></h2><p data-text="9"></p></section><section class="card"><span class="icon">💲</span><h2 data-text="10"></h2><p data-text="11"></p></section><section class="card"><span class="icon">🎞️</span><h2 data-text="12"></h2><p data-text="13"></p></section></div><p class="note" data-text="14"></p><footer><a href="./" data-text="15"></a></footer></main><script>const translations={"en":["How LOST works","A project to help lost belongings find their way home.","Lost something?","Describe the item and where it was lost, so others can help identify it.","Found something?","Describe the find without revealing sensitive details, and help return it to its owner.","Camera","A photo can help people recognize an item. Avoid showing private information.","Languages","Choose a language to read about LOST and share the project with more people.","Support","Donations are a possible way to support the project; a donation feature is not yet available here.","Video","Video can help explain and share the idea of LOST.","The project is in development. Reporting, matching, donations and downloads may not yet be available.","Back to Zambaru"],"es":["Cómo funciona LOST","Un proyecto para ayudar a devolver los objetos perdidos a sus dueños.","¿Perdiste algo?","Describe el objeto y dónde lo perdiste para que otros puedan ayudar a identificarlo.","¿Encontraste algo?","Describe el hallazgo sin revelar datos sensibles y ayuda a devolverlo a su dueño.","Cámara","Una foto puede ayudar a reconocer un objeto. Evita mostrar información privada.","Idiomas","Elige un idioma para conocer LOST y compartir el proyecto.","Apoyo","Las donaciones son una posible forma de apoyar el proyecto; esta función aún no está disponible aquí.","Vídeo","Un vídeo puede ayudar a explicar y compartir la idea de LOST.","El proyecto está en desarrollo. Los avisos, la búsqueda de coincidencias, las donaciones y las descargas pueden no estar disponibles todavía.","Volver a Zambaru"],"de":["So funktioniert LOST","Ein Projekt, das helfen soll, verlorene Gegenstände zurückzubringen.","Etwas verloren?","Beschreibe den Gegenstand und den Ort des Verlusts, damit andere helfen können.","Etwas gefunden?","Beschreibe den Fund ohne vertrauliche Angaben und hilf, ihn zurückzugeben.","Kamera","Ein Foto kann helfen, einen Gegenstand zu erkennen. Zeige keine privaten Daten.","Sprachen","Wähle eine Sprache, um LOST kennenzulernen und das Projekt zu teilen.","Unterstützung","Spenden können das Projekt unterstützen; eine Spendenfunktion ist hier noch nicht verfügbar.","Video","Videos können helfen, die Idee von LOST zu erklären und zu teilen.","Das Projekt ist in Entwicklung. Meldungen, Abgleich, Spenden und Downloads sind möglicherweise noch nicht verfügbar.","Zurück zu Zambaru"],"ar":["كيف يعمل LOST","مشروع للمساعدة في إعادة الأشياء المفقودة إلى أصحابها.","هل فقدت شيئاً؟","صف الشيء ومكان فقدانه لكي يتمكن الآخرون من المساعدة في التعرف عليه.","هل وجدت شيئاً؟","صف ما وجدته دون كشف معلومات حساسة، وساعد في إعادته إلى صاحبه.","الكاميرا","قد تساعد الصورة في التعرف على الشيء. تجنب إظهار المعلومات الخاصة.","اللغات","اختر لغة لمعرفة المزيد عن LOST ومشاركة المشروع.","الدعم","التبرعات طريقة ممكنة لدعم المشروع؛ ميزة التبرع غير متاحة هنا بعد.","الفيديو","قد يساعد الفيديو في شرح فكرة LOST ومشاركتها.","المشروع قيد التطوير. قد لا تكون البلاغات والمطابقة والتبرعات والتنزيلات متاحة بعد.","العودة إلى Zambaru"],"zh":["LOST 如何运作","帮助遗失物品回到主人身边的项目。","丢了东西？","描述物品及遗失地点，帮助其他人识别。","捡到东西？","描述拾获物，不要透露敏感信息，帮助物品回到主人身边。","相机","照片可以帮助识别物品。请避免展示私人信息。","语言","选择语言，了解 LOST 并向更多人分享这个项目。","支持","捐款是支持项目的一种可能方式；此处尚未提供捐款功能。","视频","视频可以帮助解释和分享 LOST 的理念。","项目仍在开发中。发布信息、匹配、捐款和下载功能可能尚未开放。","返回 Zambaru"],"ru":["Как работает LOST","Проект, который помогает потерянным вещам вернуться к владельцам.","Потеряли вещь?","Опишите вещь и место потери, чтобы другие могли помочь её найти.","Нашли вещь?","Опишите находку, не раскрывая личных данных, и помогите вернуть её владельцу.","Камера","Фотография поможет узнать вещь. Не показывайте личную информацию.","Языки","Выберите язык, чтобы узнать о LOST и рассказать о проекте другим.","Поддержка","Пожертвования могут помочь развитию проекта; функция пожертвований здесь пока недоступна.","Видео","Видео поможет объяснить идею LOST и рассказать о ней другим.","Проект разрабатывается. Подача объявлений, поиск совпадений, пожертвования и скачивание приложения пока могут быть недоступны.","Вернуться на Zambaru"],"az":["LOST necə işləyir","İtmiş əşyaların sahiblərinə qaytarılmasına kömək edən layihə.","Əşyanızı itirmisiniz?","Başqalarının kömək etməsi üçün əşyanı və itirildiyi yeri təsvir edin.","Nəsə tapmısınız?","Həssas məlumatları açıqlamadan tapıntını təsvir edin və sahibinə qaytarılmasına kömək edin.","Kamera","Şəkil əşyanı tanımağa kömək edə bilər. Şəxsi məlumatları göstərməyin.","Dillər","LOST haqqında oxumaq və layihəni paylaşmaq üçün dil seçin.","Dəstək","İanələr layihəni dəstəkləmək üçün mümkün üsuldur; ianə funksiyası burada hələ mövcud deyil.","Video","Video LOST ideyasını izah etməyə və paylaşmağa kömək edə bilər.","Layihə hazırlanır. Elanlar, uyğunluq axtarışı, ianələr və yükləmələr hələ əlçatan olmaya bilər.","Zambaru-ya qayıt"],"fr":["Comment fonctionne LOST","Un projet pour aider les objets perdus à retrouver leurs propriétaires.","Vous avez perdu un objet ?","Décrivez l’objet et le lieu de sa perte pour aider les autres à l’identifier.","Vous avez trouvé un objet ?","Décrivez votre trouvaille sans divulguer de données sensibles et aidez à la rendre.","Appareil photo","Une photo peut aider à reconnaître un objet. Évitez de montrer des informations privées.","Langues","Choisissez une langue pour découvrir LOST et partager le projet.","Soutien","Les dons sont un moyen possible de soutenir le projet ; cette fonction n’est pas encore disponible ici.","Vidéo","Une vidéo peut aider à expliquer et à partager l’idée de LOST.","Le projet est en développement. Les signalements, la recherche de correspondances, les dons et les téléchargements peuvent ne pas être disponibles.","Retour à Zambaru"]},languages=[["en","🇺🇸 English"],["es","🇪🇸 Español"],["de","🇩🇪 Deutsch"],["ar","🇸🇦 العربية"],["zh","🇨🇳 中文"],["ru","🇷🇺 Русский"],["az","🇦🇿 Azərbaycanca"],["fr","🇫🇷 Français"]];function setLanguage(lang){if(!translations[lang])lang='en';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-text]').forEach(e=>e.textContent=translations[lang][Number(e.dataset.text)]);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));try{localStorage.setItem('zambaru-language',lang)}catch(e){}}languages.forEach(([code,label])=>{let b=document.createElement('button');b.type='button';b.dataset.lang=code;b.textContent=label;b.onclick=()=>setLanguage(code);document.getElementById('languages').appendChild(b)});let selected='en';try{selected=localStorage.getItem('zambaru-language')||'en'}catch(e){}setLanguage(selected);</script></body></html>
